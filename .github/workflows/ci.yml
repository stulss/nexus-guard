name: NEXUS-GUARD Automated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Clean-State Audit
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suites (70+ Tests)
        run: |
          pytest tests/ -v

      - name: Verify Clean State Baseline
        run: |
          python scripts/verify_clean_state.py
