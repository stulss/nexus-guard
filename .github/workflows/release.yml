name: Build and Release NEXUS-GUARD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g., v2.5.0)'
        required: false
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suites
        run: |
          pytest tests/ -v

      - name: Verify Clean State Baseline
        run: |
          python scripts/verify_clean_state.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          python scripts/build_exe.py

      - name: Create Release Distribution Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -notlike "v*") {
            $version = "${{ github.event.inputs.version_tag }}"
            if (-not $version) { $version = "v2.5.0" }
          }
          $zipName = "NexusGuard-$version-Windows-x64.zip"
          Compress-Archive -Path dist/NexusGuard/* -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$hash *$zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          
          Write-Output "zip_path=$zipName" >> $env:GITHUB_OUTPUT
          Write-Output "sha_path=$zipName.sha256" >> $env:GITHUB_OUTPUT
          Write-Output "release_version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: NEXUS-GUARD Enterprise Active Defense Suite ${{ steps.package.outputs.release_version }}
          tag_name: ${{ steps.package.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha_path }}
          body: |
            ## NEXUS-GUARD Enterprise Active Defense Security Suite (${{ steps.package.outputs.release_version }})
            
            ### 🚀 Standalone Windows Portable Distribution (x64)
            - **No Python Installation Required**: Single-click executable with embedded runtime.
            - **Clean-Slate Guarantee**: 0 initial threats, 100/100 Security Posture verified.
            - **Enterprise Security Features**:
              - Real-Time MITRE ATT&CK Matrix Correlation (14 Tactics)
              - File Integrity Monitoring (FIM) with SHA-256 baseline hashing
              - Active Defense Decoy traps (SQLi, Directory Traversal, Ransomware canary)
              - Next-Gen SIEM & Active Firewall integration (pfSense, Wazuh, Graylog, n8n)
              - Multi-Level Threat Response (Quarantine, Decoy Redirection, Active Block)
              - Dark-Mode CISO Executive Dashboard & PDF/HTML Audit Report Exporter
            
            ### 📦 SHA-256 Checksum
            Refer to the attached `.sha256` file to verify package integrity.
